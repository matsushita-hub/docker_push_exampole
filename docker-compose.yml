services:
  db:
    image: mysql:8.0
    env_file: .env
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s


  redis:
    image: redis:alpine


  clamav:
    image: clamav/clamav:latest
    healthcheck:
      test: ["CMD", "clamdscan", "--version"]
      interval: 20s

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    command: start-dev --http-host 0.0.0.0 --bootstrap-admin-username admin --bootstrap-admin-password adminpass123
    environment:
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE}
      KC_DB_USERNAME: ${MYSQL_USER}
      KC_DB_PASSWORD: ${MYSQL_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/live HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep 'HTTP/1.1 200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build: ./web
    env_file: .env
    volumes:
      - ./web:/app
      - ./storage:/app/shared_uploads
    extra_hosts:
      - "localhost:host-gateway"
      - "keycloak:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      clamav:
        condition: service_healthy
      keycloak:
        condition: service_healthy


  worker:
    build: ./web
    command: celery -A app.celery_app worker --loglevel=info
    env_file: .env
    volumes:
      - ./web:/app
      - ./storage:/app/shared_uploads
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
      clamav:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    extra_hosts:
      - "keycloak:host-gateway"


  proxy:
    image: nginx:latest
    ports:
      - "8081:8081"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web


volumes:
  db_data:
